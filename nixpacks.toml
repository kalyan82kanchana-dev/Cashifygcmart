[phases.setup]
nixPkgs = ["nodejs-20_x", "python311"]

[phases.install]
cmds = [
    "cd frontend && rm -f package-lock.json && npm install --legacy-peer-deps",
    "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "cd backend && python3 -m uvicorn server:app --host 0.0.0.0 --port $PORT"